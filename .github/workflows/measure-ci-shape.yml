name: measure-ci-shape
#
# E-6 — **4잡(lint·typecheck·test·build) vs 1잡(verify)** 을 잰다.
#
# 왜 재나: 산출물 바닥의 "4종을 각각 별도 required check 로" 는
# 🔵 **프로젝트 선택**이다 — `C50-12` 가 *"4종이 보편"* 을 기각했다.
# 근거가 없는 자리에서는 **대표 작업으로 재는 것 말고 답이 없다.**
#
# 설계: 두 모양을 **같은 run 안에서** 돌린다. 러너 상태·캐시·네트워크가
# 같은 조건이라야 비교가 성립한다. 다른 날 따로 돌리면 그건 측정이 아니라 일화다.
#
# 대상은 canary/ — 이 저장소가 이미 갖고 있는 실제 Python 프로젝트다.
# ⚠️ 작은 프로젝트다. 결과를 큰 프로젝트에 그대로 옮기지 않는다.

on:
  workflow_dispatch:
    inputs:
      round:
        description: 반복 회차 (기록용)
        required: false
        default: "1"

permissions:
  contents: read

env:
  WD: canary

jobs:
  # ── 모양 A — 지금 쓰는 4잡. 준비(checkout+uv+sync)를 네 번 한다 ──
  a_lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv sync --locked
        working-directory: ${{ env.WD }}
      - run: uv run ruff check . && uv run ruff format --check .
        working-directory: ${{ env.WD }}

  a_typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv sync --locked
        working-directory: ${{ env.WD }}
      - run: uv run mypy .
        working-directory: ${{ env.WD }}

  a_test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv sync --locked
        working-directory: ${{ env.WD }}
      - run: uv run pytest
        working-directory: ${{ env.WD }}

  a_build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv sync --locked
        working-directory: ${{ env.WD }}
      - run: uv build
        working-directory: ${{ env.WD }}

  # ── 모양 B — 한 잡에서 순서대로. 준비를 한 번만 한다 ──
  b_verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv sync --locked
        working-directory: ${{ env.WD }}
      - run: uv run ruff check . && uv run ruff format --check .
        working-directory: ${{ env.WD }}
      - run: uv run mypy .
        working-directory: ${{ env.WD }}
      - run: uv run pytest
        working-directory: ${{ env.WD }}
      - run: uv build
        working-directory: ${{ env.WD }}
