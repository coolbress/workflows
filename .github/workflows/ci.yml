name: CI
#
# 이 저장소 자신의 무결성 검사.
#
# 여기의 워크플로는 다른 저장소들이 `uses:` 로 부른다 — 문법이 깨지면
# 호출하는 쪽이 전부 깨진다. 그래서 자기 워크플로를 스스로 린트한다.
#
# 잡 이름이 `integrity` 인 것은 우연이 아니다: 룰셋의
# required_status_checks 가 이 이름을 요구한다.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# PR 에 새로 푸시하면 이전 실행을 취소한다. main 은 취소하지 않는다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 🔴 체크아웃은 기본으로 토큰을 `.git/config` 에 남긴다. 워크스페이스째
          # 아티팩트로 올리면 그게 같이 나간다(zizmor `artipacked`).
          # 이 저장소의 잡은 **아무것도 푸시하지 않는다** — 그래서 끈다.
          persist-credentials: false

      # 🔴 `docker://` 로 쓰지 않는다 — 그 형태가 **두 번 값을 치렀다**:
      #   ① Actions allowlist 패턴에 `docker://` 가 들어가지 않아 이 저장소만 allowlist 를 못 걸었다
      #   ② 의존성 그래프에도 안 잡혀 경보도 갱신 PR 도 오지 않았다
      #      (standards: audit/DEPENDENCY-GRAPH-SCOPE.ko.md)
      # rhysd/actionlint 에는 **공식 Action 이 없다**(Docker 이미지뿐). 제3자 래퍼를
      # 중앙 저장소에 들이는 대신 **공식 릴리스 바이너리를 체크섬으로 검증해** 쓴다.
      # 다이제스트 핀과 같은 보장(바뀌면 실패)을 주면서 allowlist 를 막지 않는다.
      # 올릴 때: 버전과 체크섬을 **같이** 바꾼다. 체크섬은 릴리스의 checksums.txt 에 있다.
      - name: actionlint 설치 — 공식 릴리스 + SHA256 검증
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/actionlint"; mkdir -p "$d"
          f="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "$d/$f" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$f"
          echo "${ACTIONLINT_SHA256}  $d/$f" | sha256sum -c -
          tar -xzf "$d/$f" -C "$d" actionlint
          echo "$d" >> "$GITHUB_PATH"

      # actionlint 는 있으면 shellcheck·pyflakes 로 `run:` 블록까지 검사한다.
      - name: 워크플로 문법·사용법 검사
        run: actionlint -color

      # 🔴 여기까지는 YAML 만 봤다. 이 저장소의 나머지도 전부 실행 코드다 —
      # new-project.sh 는 저장소를 만들고 지우고, ruleset.json 은 새 저장소의 벽이 된다.
      # 검사하지 않으면 "중앙에 하나 있으니 안전하다"가 근거 없는 말이 된다.
      - name: 셸 문법 (bash -n)
        run: bash -n new-project.sh tools/*.sh tests/*.sh

      - name: 셸 정적 검사 (shellcheck)
        run: shellcheck new-project.sh tools/*.sh tests/*.sh

      # 🔒 워크플로 보안 정적분석. `actionlint` 은 정확성, 이건 보안 — 층이다.
      # 🔴 **여기는 전부 막는다**(소비자용 `python-ci.yml` 은 medium 이상).
      # 이 저장소의 워크플로는 **남의 저장소에서 돈다** — 폭발 반경이 가장 크다.
      - name: 워크플로 보안 (zizmor · 전부)
        # ⚠️ 이 잡은 액션을 안 쓴다 — 허용목록을 건드리지 않으려는 규율이다.
        # `pipx` 는 러너에 이미 있고 액션이 아니므로 allowlist 와 무관하다.
        run: pipx run zizmor==1.29.0 --no-progress .github/workflows/

      - name: 룰셋 불변식 — 벽이 벽인가
        run: ./tools/check-ruleset.sh ruleset.json

      # gh 를 목으로 바꿔 **모든 단계에서 실패시켜 본다.**
      # 지켜야 할 성질은 하나다: 어디서 넘어져도 벽 없는 원격 저장소를 남기지 않는다.
      - name: 생성 스크립트 실패 경로
        run: ./tests/new-project-failpath.sh

      # 지켜야 할 성질: **'왜' 없이는 릴리스가 안 나간다.**
      # 빈 노트파일을 받아주면 이 도구는 `--generate-notes` 의 별칭이 된다.
      - name: 릴리스 도구 가드
        run: ./tests/make-release-guards.sh

      # 규칙을 옮겨 적지 않고 python-ci.yml 에서 **뽑아서** 시험한다.
      # 옮겨 적으면 두 곳이 되고, 두 곳이 되면 갈린다.
      - name: PR 제목 판정 규칙
        run: ./tests/pr-title-cases.sh

      # 🔴 훅이 세션을 막으면 안 된다. fail-open 을 검사로 잠근다 —
      # 보여주는 훅이 일을 막으면 그건 벽 흉내이고, 벽은 GitHub 에 있다.
      - name: 플러그인 훅 (fail-open · 길이 · 네트워크 없음)
        run: ./tests/plugin-hooks.sh

      # 🔴 "안 고친다" 는 산문이 아니라 **장치**여야 한다. 그리고 `allowed-tools` 는
      # 잠그는 게 아니라 **푸는 것**이다 — 그 혼동이 들어오는 것도 막는다.
      - name: 플러그인 매니페스트 (읽기전용 집행 · 버전 일치 · SHA 핀)
        run: ./tests/plugin-manifests.sh
      - name: 룰셋 갱신 — 이름 가드 (오지 않을 검사를 요구하면 머지 불가가 된다)
        run: ./tests/upgrade-ruleset-guard.sh

      # 🔴 규칙 종류를 더할 때 **다른 필드를 지우지 않는가.** 손으로 JSON 을 붙이면
      # bypass_actors 나 enforcement 가 조용히 날아가고 그게 벽이 약해지는 방식이다.
      - name: 룰셋 규칙 추가 — 더하기만 하는가
        run: ./tests/add-ruleset-rule.sh

      # 🔴 pty 를 실제로 띄운다. 붙여넣은 다음 명령줄이 토큰으로 삼켜지면
      # 그 명령은 조용히 사라진다 — 실측으로 그랬다.
      - name: 관리자 토큰 프롬프트 (stdin 을 먹지 않는다)
        run: ./tests/token-prompt-not-from-stdin.sh

      # 🔴 200 을 받아도 걸린 게 아니다. 확인 없는 명령이 조용한 no-op 으로 끝난 사고가 있었다.
      - name: 보안 설정 — 쓰고 나서 확인하는가
        run: ./tests/security-setting.sh

      # 🔴 태그가 핀 주석의 근거다. 생성을 막으면 릴리스를 못 내므로 삭제·이동만 막는다.
      - name: 태그 룰셋 — 생성은 막지 않는가 · 우회자 0 인가
        run: ./tests/tag-ruleset.sh

      # 🔴 **시험 파일이 여기 안 적히면 그 시험은 영영 안 돈다.**
      # 실측(2026-08-30): `security-setting.sh` 가 그렇게 빠졌다 — `&&` 사슬이 끊겨
      # 배선 단계가 실행되지 않았는데 **CI 는 초록이었다.** 시험이 있는 것과 도는 것은 다르다.
      - name: 모든 시험이 실제로 배선됐나
        run: ./tests/all-tests-are-wired.sh

      # 🔴 같은 병의 다른 얼굴 — 입력을 만들어놓고 **아무도 안 넘기면** 그 경로는 안 돈다.
      # 실측: `extra-python-versions` 가 그랬다. 선언한 것과 도는 것은 다른 문장이다.
      - name: 입력이 실제로 넘겨지나 (`if:` 로 막힌 것)
        run: ./tests/inputs-are-exercised.sh

      # 🔴 아키타입 목록의 정본은 템플릿의 copier.yml 이다. 여기 베끼면 갈린다 — 갈렸었다.
      - name: 아키타입 목록이 한 곳에서만 오나
        run: ./tests/archetype-single-source.sh

      # 🔴 리뷰 벽의 판정은 `run:` 안의 파이썬 한 토막이다 — 안 돌려보면 첫 실행이 시험이 되고
      # 그때는 이미 PR 이 빨갛다. **막을 것과 막으면 안 되는 것을 둘 다** 본다.
      - name: 제3자 리뷰 벽의 계약
        run: ./tests/pr-review-gate.sh

  # 🔴 canary — 재사용 워크플로를 **실제로 호출한다.**
  # actionlint 가 통과한 것과 워크플로가 도는 것은 다른 문장이다.
  # 소비자(project-template)가 깨지기 전에 여기서 깨진다.
  canary:
    uses: ./.github/workflows/python-ci.yml
    with:
      working-directory: canary
      # 🔴 **입력이 있는 것과 도는 것은 다르다.** 카나리가 실제로 넘겨야 그 경로가 돈다 —
      # 안 넘기면 `extra-python-versions` 는 아무 데서도 안 돌고 그걸 아무도 모른다
      # (오늘 `security-setting.sh` 가 정확히 그렇게 배선이 빠진 채 초록이었다).
      extra-python-versions: "3.13"

  # 🤝 **제3자가 본다** — `standards` R5-40 의 ⓒ 층. 검사 이름은 `third-party / review`.
  # 🔴 **자기 자신에게 먼저 건다.** 이 워크플로는 남의 저장소에서 도는데, 여기서 안 돌려보면
  # *"YAML 이 맞다"* 까지만 아는 것이다 — `extra-python-versions` 가 정확히 그래서 아무 데서도
  # 안 돌고 있었다(2026-08-30). **카나리는 남이 아니라 우리가 먼저 맞는 것이다.**
  third-party:
    if: github.event_name == 'pull_request'
    # 🔴 **호출부가 권한을 준다.** 이 워크플로 맨 위는 `contents: read` 뿐이라
    # 불린 워크플로가 요구하는 `pull-requests: write` 를 못 준다 —
    # 그러면 실행이 아니라 **시작이 실패한다**(startup_failure).
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/pr-review.yml
    secrets:
      # `inherit` 를 안 쓴다 — 필요한 것 하나만 넘긴다(zizmor overprovisioned_secrets).
      openai_api_key: ${{ secrets.OPENAI_API_KEY }}
