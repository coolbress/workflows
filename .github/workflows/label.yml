# 이 저장소의 PR 에 타입 라벨을 붙인다. 로직은 여기 없다 — 재사용 워크플로에 있다.
#
# ⚠️ 잡 이름이 `ci` 가 아니다. 일부러 그렇다 —
# 이건 **검사가 아니고 룰셋에 안 들어간다.** `ci / *` 이름과 섞이면 안 된다.
name: PR label

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write   # 라벨을 붙이는 데만 쓴다

jobs:
  label:
    uses: ./.github/workflows/pr-label.yml
