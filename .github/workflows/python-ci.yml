name: python-ci
#
# 재사용 워크플로 — 호출부는 각 저장소에 5줄로 남는다:
#
#   jobs:
#     ci:
#       uses: coolbress/workflows/.github/workflows/python-ci.yml@<commit-sha>
#
# 왜 4개 잡으로 쪼개는가: 산출물 바닥이 lint·typecheck·test·build 를
# **각각 별도 required check** 로 요구한다 (direction/05 §CI/CD).
# 한 잡에 4스텝으로 넣으면 첫 실패에서 멈춰 나머지 3개의 상태를 알 수 없고,
# 룰셋이 개별 검사를 요구할 수도 없다.
#
# Actions 는 커밋 SHA 로 핀한다 — 태그는 가변이라 공급망 벡터다
# (corpus/aspects/04 foundation-floor-artifact-checklist: MUST).
# 인라인 주석의 버전은 핀된 SHA 가 가리키는 태그다.

on:
  workflow_call:
    inputs:
      working-directory:
        description: |
          프로젝트 루트. 기본은 저장소 루트다.
          이 저장소 자신의 canary 잡이 `canary/` 를 넘겨 **실제로 이 워크플로를 호출해** 본다 —
          YAML 문법이 맞는 것과 워크플로가 도는 것은 다른 문장이기 때문이다.
        type: string
        default: "."

      max-diff-lines:
        description: |
          한 PR 이 **리뷰 대상**으로 바꿀 수 있는 줄 수의 상한(추가 + 삭제).
          `0` 을 주면 재기만 하고 막지 않는다.
        type: number
        default: 400

      deps-fail-on-severity:
        description: |
          `ci / deps` 가 막는 취약점 심각도의 하한 — `critical|high|moderate|low`.
          🔴 **Dependabot 과 다른 물건이다**: Dependabot 은 **경보와 갱신 PR**(사후)이고
          이 검사는 **PR 에서 취약 의존성이 들어오는 것을 막는다**(사전).
        type: string
        default: high

      diff-size-exclude:
        description: |
          계수에서 뺄 경로 패턴. 공백으로 구분하고 git pathspec 으로 들어간다.
          기본값이 문서와 락파일인 이유는 하나다 — **산문 한 줄과 `mypy --strict` 를
          통과해야 하는 코드 한 줄은 리뷰 부담이 같지 않다.**
        type: string
        default: "*.md *.lock *lock.json *lock.yaml *lock.yml LICENSE"

# 기본 토큰은 write-broad 다. 최소로 내린다 (같은 체크리스트: MUST).
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 🔴 체크아웃은 기본으로 토큰을 `.git/config` 에 남긴다. 워크스페이스째
          # 아티팩트로 올리면 그게 같이 나간다(zizmor `artipacked`).
          # 이 저장소의 잡은 **아무것도 푸시하지 않는다** — 그래서 끈다.
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      # --locked: 락파일이 없거나 pyproject 와 어긋나면 실패한다.
      # 락파일 커밋은 바닥의 MUST 이므로 검사가 아니라 전제로 둔다.
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

      # 🔒 워크플로 **보안** 정적분석. `actionlint` 이 정확성을 보고 이건 보안을 본다 —
      # 대안이 아니라 층이다(템플릿 인젝션 · 자격증명 유출 · 캐시 오염 · impostor commit).
      # ⚠️ **버전을 박는다** — 안 박으면 새 감사 규칙이 들어오는 날 소비자 CI 가 무관하게 빨개진다
      # (`ruff` 를 박는 것과 같은 이유).
      # 🔴 **여기는 medium 이상만 막는다.** 이 워크플로는 **남의 저장소에서** 돌고, low 는
      # confidence 도 low 라 남을 무관하게 깨뜨린다. 우리 자신은 `ci.yml` 에서 **전부** 막는다.
      - name: 워크플로 보안 (zizmor · medium 이상)
        run: uvx zizmor@1.29.0 --no-progress --min-severity medium .github/workflows/
        working-directory: ${{ github.workspace }}

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 🔴 체크아웃은 기본으로 토큰을 `.git/config` 에 남긴다. 워크스페이스째
          # 아티팩트로 올리면 그게 같이 나간다(zizmor `artipacked`).
          # 이 저장소의 잡은 **아무것도 푸시하지 않는다** — 그래서 끈다.
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run mypy .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 🔴 체크아웃은 기본으로 토큰을 `.git/config` 에 남긴다. 워크스페이스째
          # 아티팩트로 올리면 그게 같이 나간다(zizmor `artipacked`).
          # 이 저장소의 잡은 **아무것도 푸시하지 않는다** — 그래서 끈다.
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest

  # 🔍 시크릿 탐지 — **푸시 보호와 겹치는 게 아니라 다른 것을 잡는다.**
  # 실측(standards: audit/SECRET-DETECTION-OVERLAP): 푸시 보호는 **공급자 형식만** 막고
  # **개인키 PEM 과 일반 시크릿은 통과시킨다.** gitleaks 는 개인키 1/1 · 공급자 6/6 을 잡았다.
  # ⚠️ 다만 이건 **벽이 아니라 검사**다 — 여기까지 왔다는 건 시크릿이 **이미 GitHub 에 올라갔다**는 뜻이다.
  # 막는 것은 푸시 보호이고, 이건 **머지를 막고 알린다.**
  # uv 를 안 쓰므로 별도 잡이다 — 그리고 별도여야 "lint 실패" 가 아니라 "시크릿" 으로 읽힌다.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # 히스토리까지 본다 — 아래 `gitleaks git` 이 이걸 필요로 한다
          persist-credentials: false   # 푸시하지 않는다 (zizmor `artipacked`)
      # actionlint 과 같은 방식: 공식 릴리스 + SHA256. `uses:` 가 아니라 allowlist 를 막지 않는다.
      - name: gitleaks 설치 — 공식 릴리스 + SHA256 검증
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/gitleaks"; mkdir -p "$d"
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 -o "$d/$f" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "${GITLEAKS_SHA256}  $d/$f" | sha256sum -c -
          tar -xzf "$d/$f" -C "$d" gitleaks
          echo "$d" >> "$GITHUB_PATH"
      # 🔴 `dir` 이 아니라 `git` 이다. `dir` 은 **현재 파일만** 본다 —
      # `fetch-depth: 0` 으로 히스토리를 받아 놓고 `dir` 로 훑으면 히스토리는 안 본 것이고,
      # **주석만 히스토리를 본다고 말하는 상태**가 된다. 지워진 시크릿은 지워도 히스토리에 남는다.
      - name: 시크릿 탐지 — 히스토리 포함
        working-directory: ${{ inputs.working-directory }}
        run: gitleaks git . --no-banner --redact

  # 📏 diff 크기 — **리뷰 가능성의 게이트**다. 정확성이 아니라 사람이 볼 수 있는가를 본다.
  #
  # 🔴 이 잡이 생긴 이유: coolbress/divcal #1 에서 이슈 본문에 "PR diff 400줄 이하" 라고
  # 적어놓고 436줄을 냈는데 **아무것도 막지 않았다.** 작성자가 자진 신고해서 알았을 뿐이다.
  # 규칙이 문서에만 있으면 발화하지 않는다 — 그게 이 프로젝트가 반복해 죽은 형태다.
  #
  # 왜 지금인가(실측 2026): AI 보조 PR 은 사람 PR 의 **2.6배**(p75 408줄 대 157줄)이고,
  # 에이전트가 연 PR 은 리뷰어 픽업까지 **5.3배** 오래 걸린다. 그리고 리뷰 공수를 예측하는
  # 것은 **diff 크기**지 PR 본문이 아니다 — arXiv 2601.00753 에서 본문 텍스트는 AUC 0.57,
  # 사실상 무의미했다. *"부담은 에이전트가 무엇을 건드렸는지로 정해지지 무엇을 말했는지로
  # 정해지지 않는다."*
  #
  # 🔴 세는 방법이 규칙만큼 중요하다. 그 PR 을 이 계량기로 다시 재봤다(실측):
  #   전부 세면 452줄(+436/-16) → 초과.  문서·락파일을 빼면 385줄(+375/-10) → 통과.
  # **규칙이 틀린 게 아니라 계량기가 틀렸다.** README 산문 한 줄이 mypy strict 를 통과해야
  # 하는 코드 한 줄과 같은 무게로 세어지고 있었다.
  # PR 제목이 Conventional Commits 인가 — **타입은 표준 11종만.**
  #
  # 왜 제목인가: 우리는 squash 전용이라 **PR 제목이 곧 랜딩 커밋**이다. 브랜치의 개별
  # 커밋은 뭉개지므로 하중을 안 받는다. 시중도 여기로 옮겼다(2026 관행).
  #
  # 🔴 왜 표준 어휘만인가 (`standards` R5-30 정정, 2026-08-28): 확장 어휘를 문서에 적어두는
  # 방식이 **하루를 못 버텼다** — 목록이 적혀 있는 상태에서 에이전트가 `record:`·`anchor:` 를
  # 즉석에서 만들었고 둘 다 실은 `docs:` 였다. 모델이 꺼내는 것은 **훈련에 있는 목록**이다.
  # 규격도 `feat`·`fix` 만 필수로 두고 나머지는 *"not mandated"* 이며 **scope 는 자유형**이므로,
  # 지역 의미는 `docs(research):` 처럼 **scope 가 진다** — 잃는 것이 없다.
  pr-title:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: 제목을 검사한다
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail

          # 🔴 PR 이 아닐 때 **잡을 건너뛰지 않고 통과로 보고한다.** `diff-size` 와 같은 이유다 —
          # `if:` 로 건너뛰면 검사 이름이 보고되지 않는 경로가 생기고, 룰셋이 그 이름을 요구하는
          # 순간 저장소가 조용히 머지 불가로 잠긴다.
          if [ -z "${TITLE:-}" ]; then
            echo "PR 이 아니다 — 검사할 제목이 없다."
            echo "### 🏷️ PR 제목 — PR 이 아니라 검사하지 않았다" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          types='feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert'
          if printf '%s' "$TITLE" | grep -qE "^($types)(\([a-zA-Z0-9_.,/ -]+\))?!?: .+"; then
            echo "✅ $TITLE"
            echo "### 🏷️ PR 제목 — 규약을 지킨다" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "::error::PR 제목이 Conventional Commits 가 아니다: ${TITLE}"
          {
            echo "### 🏷️ PR 제목이 규약을 안 지킨다"
            echo
            echo "\`\`\`"
            echo "$TITLE"
            echo "\`\`\`"
            echo
            echo "**형식**: \`type(scope): 요약\`  ·  범위 변경이면 \`type(scope)!: 요약\`"
            echo
            echo "**타입은 이 11종뿐이다** (\`@commitlint/config-conventional\`):"
            echo "\`feat\` \`fix\` \`docs\` \`style\` \`refactor\` \`perf\` \`test\` \`build\` \`ci\` \`chore\` \`revert\`"
            echo
            echo "🔵 **지역 의미는 scope 로 쓴다** — 새 타입을 만들지 마라:"
            echo "| 이렇게 쓰고 싶었다면 | 이렇게 쓴다 |"
            echo "|---|---|"
            echo "| \`research:\` \`record:\` \`anchor:\` | \`docs(research):\` \`docs:\` |"
            echo "| \`decide:\` \`decision:\` \`audit:\` | \`docs(decision):\` \`docs(audit):\` |"
            echo "| \`move:\` | \`refactor(layout):\` |"
            echo "| \`deps:\` \`security:\` | \`build(deps):\` \`fix(security):\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

  # 🔴 **벽이지 그물이 아니다.** Dependabot 은 이미 들어온 것을 뒤늦게 알려주고,
  # 이 잡은 **PR 에서 들어오는 것을 막는다.** 우리 축(벽 vs 그물)으로 정확히 갈리는 자리이고
  # 2026-08-30 까지 그물만 있고 벽이 없었다.
  # ⚠️ 의존성 그래프가 켜져 있어야 한다(공개 저장소는 기본이다).
  deps:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 🔴 체크아웃은 기본으로 토큰을 `.git/config` 에 남긴다. 워크스페이스째
          # 아티팩트로 올리면 그게 같이 나간다(zizmor `artipacked`).
          # 이 저장소의 잡은 **아무것도 푸시하지 않는다** — 그래서 끈다.
          persist-credentials: false

      - name: 의존성 리뷰 — PR 이 들여오는 취약 버전을 막는다
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: ${{ inputs.deps-fail-on-severity }}
          comment-summary-in-pr: on-failure
          # 🚫 `deny-licenses` 를 여기서 안 정한다 — 아웃바운드 라이선스는 **프로젝트마다 다르고**
          # 틀리게 박으면 정당한 의존성이 막힌다. 프로젝트가 필요하면 자기 호출에서 준다.

      # 🔴 PR 이 아닐 때 **잡을 건너뛰지 않는다.** `pr-title`·`diff-size` 와 같은 이유다 —
      # 건너뛰면 검사 이름이 보고되지 않는 경로가 생기고, 룰셋이 그 이름을 요구하는
      # 순간 저장소가 **조용히 머지 불가**로 잠긴다.
      - name: PR 이 아니다 — 검사할 diff 가 없다
        if: github.event_name != 'pull_request'
        run: |
          echo "PR 이 아니다 — 의존성 변화를 비교할 base 가 없다."
          echo "### 📦 의존성 리뷰 — PR 이 아니라 검사하지 않았다" >> "$GITHUB_STEP_SUMMARY"

  diff-size:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # base...head 를 계산하려면 양쪽 히스토리가 다 있어야 한다
          persist-credentials: false   # 푸시하지 않는다 (zizmor `artipacked`)

      - name: 리뷰 대상 diff 를 잰다
        env:
          MAX_LINES: ${{ inputs.max-diff-lines }}
          EXCLUDE: ${{ inputs.diff-size-exclude }}
          WORKDIR: ${{ inputs.working-directory }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # 🔴 PR 이 아닐 때 **잡을 건너뛰지 않고 통과로 보고한다.**
          # `if:` 로 잡을 통째로 건너뛰면 검사 이름이 보고되지 않는 경로가 생기고,
          # 룰셋이 언젠가 그 이름을 요구하는 순간 저장소가 조용히 머지 불가로 잠긴다.
          # 이 저장소가 가장 경계하는 실패라서 조건을 잡이 아니라 **스텝 안**에 둔다.
          if [ -z "$BASE_SHA" ] || [ -z "$HEAD_SHA" ]; then
            echo "PR 이 아니다 — 잴 diff 가 없다."
            echo "### 📏 diff 크기 — PR 이 아니라 재지 않았다" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          root="${WORKDIR%/}"
          if [ -z "$root" ] || [ "$root" = "." ]; then
            prefix=""
            spec=(".")
          else
            prefix="$root/"
            spec=("$root")
          fi

          patterns=()
          if [ -n "$EXCLUDE" ]; then
            read -r -a patterns <<< "$EXCLUDE"
          fi
          for p in ${patterns+"${patterns[@]}"}; do
            spec+=(":(exclude)${prefix}${p}")
          done

          # 세 점(base...head)은 머지베이스부터의 변경이다 — GitHub 이 PR 에 보여주는 것과 같다.
          if ! numstat="$(git diff --numstat "${BASE_SHA}...${HEAD_SHA}" -- "${spec[@]}")"; then
            echo "::error::diff 를 계산하지 못했다 (base=${BASE_SHA} head=${HEAD_SHA})."
            exit 1
          fi

          added=0
          removed=0
          while read -r a d _; do
            if [ -z "$a" ] || [ "$a" = "-" ]; then   # 빈 줄 · 바이너리
              continue
            fi
            added=$((added + a))
            removed=$((removed + d))
          done <<< "$numstat"
          total=$((added + removed))

          {
            echo "### 📏 diff 크기"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| 리뷰 대상 변경 | **${total}줄** (+${added} / -${removed}) |"
            echo "| 상한 | ${MAX_LINES}줄 |"
            echo "| 계수에서 뺀 것 | \`${EXCLUDE}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$MAX_LINES" -le 0 ]; then
            echo "상한이 0 이다 — 재기만 하고 막지 않는다: ${total}줄"
            exit 0
          fi

          if [ "$total" -gt "$MAX_LINES" ]; then
            echo "::error::리뷰 대상 diff 가 ${total}줄이다 (상한 ${MAX_LINES}). 쪼개라."
            {
              echo
              echo "🔴 **상한을 넘었다.** 문서와 락파일은 이미 뺀 숫자다."
              echo
              echo "쪼개는 법: 한 덩어리를 의존 사슬로 갈라 **스택**으로 낸다"
              echo "(데이터 → API → 배선 → UX). 층마다 리뷰어가 달라질 수 있다."
              echo "\`gh stack\` 이 그걸 한다."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "✅ ${total}줄 / 상한 ${MAX_LINES}줄"

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 🔴 체크아웃은 기본으로 토큰을 `.git/config` 에 남긴다. 워크스페이스째
          # 아티팩트로 올리면 그게 같이 나간다(zizmor `artipacked`).
          # 이 저장소의 잡은 **아무것도 푸시하지 않는다** — 그래서 끈다.
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv build

      # 🔴 `uv build` 는 **파일이 만들어졌다**까지만 증명한다.
      # 그 파일이 깨끗한 환경에 설치되고 import 되는지는 다른 문장이다 —
      # 빠지는 패키지 데이터·잘못된 패키지 이름·깨진 메타데이터는 여기서만 잡힌다.
      - name: 설치 smoke — wheel 과 sdist 를 실제로 설치해 본다
        run: |
          set -euo pipefail
          name="$(uv run python -c 'import tomllib,pathlib;print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["name"])')"
          for art in dist/*.whl dist/*.tar.gz; do
            rm -rf .smoke
            uv venv --quiet .smoke
            uv pip install --quiet --python .smoke/bin/python "$art"
            .smoke/bin/python -c 'import importlib.metadata as md,sys; print(sys.argv[1], md.version(sys.argv[1]))' "$name"
            if [ -d src ]; then
              for m in src/*/; do
                m="$(basename "$m")"
                .smoke/bin/python -c 'import importlib,sys; importlib.import_module(sys.argv[1])' "$m"
                echo "  import $m ok"
              done
            fi
            echo "  ✅ $art"
          done
