name: python-ci
#
# 재사용 워크플로 — 호출부는 각 저장소에 5줄로 남는다:
#
#   jobs:
#     ci:
#       uses: coolbress/workflows/.github/workflows/python-ci.yml@<commit-sha>
#
# 왜 4개 잡으로 쪼개는가: 산출물 바닥이 lint·typecheck·test·build 를
# **각각 별도 required check** 로 요구한다 (direction/05 §CI/CD).
# 한 잡에 4스텝으로 넣으면 첫 실패에서 멈춰 나머지 3개의 상태를 알 수 없고,
# 룰셋이 개별 검사를 요구할 수도 없다.
#
# Actions 는 커밋 SHA 로 핀한다 — 태그는 가변이라 공급망 벡터다
# (corpus/aspects/04 foundation-floor-artifact-checklist: MUST).
# 인라인 주석의 버전은 핀된 SHA 가 가리키는 태그다.

on:
  workflow_call:
    inputs:
      working-directory:
        description: |
          프로젝트 루트. 기본은 저장소 루트다.
          이 저장소 자신의 canary 잡이 `canary/` 를 넘겨 **실제로 이 워크플로를 호출해** 본다 —
          YAML 문법이 맞는 것과 워크플로가 도는 것은 다른 문장이기 때문이다.
        type: string
        default: "."

# 기본 토큰은 write-broad 다. 최소로 내린다 (같은 체크리스트: MUST).
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      # --locked: 락파일이 없거나 pyproject 와 어긋나면 실패한다.
      # 락파일 커밋은 바닥의 MUST 이므로 검사가 아니라 전제로 둔다.
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run mypy .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv build

      # 🔴 `uv build` 는 **파일이 만들어졌다**까지만 증명한다.
      # 그 파일이 깨끗한 환경에 설치되고 import 되는지는 다른 문장이다 —
      # 빠지는 패키지 데이터·잘못된 패키지 이름·깨진 메타데이터는 여기서만 잡힌다.
      - name: 설치 smoke — wheel 과 sdist 를 실제로 설치해 본다
        run: |
          set -euo pipefail
          name="$(uv run python -c 'import tomllib,pathlib;print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["name"])')"
          for art in dist/*.whl dist/*.tar.gz; do
            rm -rf .smoke
            uv venv --quiet .smoke
            uv pip install --quiet --python .smoke/bin/python "$art"
            .smoke/bin/python -c 'import importlib.metadata as md,sys; print(sys.argv[1], md.version(sys.argv[1]))' "$name"
            if [ -d src ]; then
              for m in src/*/; do
                m="$(basename "$m")"
                .smoke/bin/python -c 'import importlib,sys; importlib.import_module(sys.argv[1])' "$m"
                echo "  import $m ok"
              done
            fi
            echo "  ✅ $art"
          done
