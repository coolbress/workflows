# 🤝 **제3자가 이 커밋을 봤는가** — `standards` `GAPS` R5-40 의 ⓒ 층. 검사 이름은 `third-party / review`.
#
# 🔴 **왜 `ci.yml` 이 아니라 자기 파일인가**: 이 검사는 `pull_request_review` 에도 걸려야 한다 —
# 제3자 리뷰는 **비동기**라 붙는 순간 다시 돌아 초록이 되어야 하기 때문이다.
# 그 트리거를 `ci.yml` 에 넣으면 **리뷰가 달릴 때마다 CI 전체가 다시 돈다.**
#
# ⚠️ `branches:` 를 안 건다 — 쌓은 PR(stacked)도 이 벽을 지나야 한다.
name: third-party

on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: write   # 리뷰가 없을 때 `@codex review` 를 다는 데만 쓴다

# 같은 PR 에서 겹쳐 돌지 않게 한다 — 기다리는 잡이라 겹치면 분만 태운다.
concurrency:
  group: third-party-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  third-party:
    uses: ./.github/workflows/pr-review.yml
