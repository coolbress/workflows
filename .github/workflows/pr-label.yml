# PR 제목의 **타입을 라벨로 옮긴다.** 재사용 워크플로다.
#
# 왜 필요한가: GitHub 의 자동 릴리스 노트(`.github/release.yml`)는 **라벨로만** 묶는다.
# 제목이 아니라 라벨이다. 그래서 분류된 노트를 원하면 라벨이 있어야 한다.
#
# 🔵 **제목이 유일한 출처다.** `actions/labeler` 는 파일 경로나 브랜치 이름으로 붙이는데,
# 그러면 규칙이 **두 곳**(제목 규약 + 라벨러 설정)에 생기고 조용히 갈린다 —
# 목록이 흩어져 갈리는 것이 `standards` R5-30 정정을 부른 결함이다.
# `ci / pr-title` 이 이미 제목의 타입을 강제하므로, **그 타입을 그대로 라벨로 쓴다.**
#
# ⚠️ 이 워크플로는 **검사가 아니다.** 실패해도 머지를 막지 않는다(룰셋에 안 넣는다).
# 라벨이 없으면 릴리스 노트가 한 덩어리로 나올 뿐이고, 그건 막을 일이 아니다.
name: PR label

on:
  workflow_call:

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: 제목의 타입을 라벨로 붙인다
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ github.event.pull_request.title }}
          NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
        run: |
          set -euo pipefail

          if [ -z "${TITLE:-}" ] || [ -z "${NUMBER:-}" ]; then
            echo "PR 이 아니다 — 붙일 라벨이 없다."
            exit 0
          fi

          # 🔴 포크 PR 은 `pull_request` 토큰이 읽기 전용이라 라벨을 못 붙인다.
          # 실패시키지 않고 알린다 — 라벨은 편의이지 벽이 아니다.
          if [ "${IS_FORK:-false}" = "true" ]; then
            echo "포크 PR 이다 — 토큰이 읽기 전용이라 라벨을 건너뛴다."
            exit 0
          fi

          type="$(printf '%s' "$TITLE" | sed -nE 's/^([a-z]+)(\([^)]*\))?!?:.*/\1/p')"
          if [ -z "$type" ]; then
            echo "제목에서 타입을 못 읽었다 — ci / pr-title 이 이미 막았을 것이다."
            exit 0
          fi

          case "$type" in
            feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert) ;;
            *) echo "표준 타입이 아니다: $type — 건너뛴다"; exit 0 ;;
          esac

          # 이미 붙어 있으면 아무것도 안 한다 (edited 로 여러 번 돈다).
          if gh pr view "$NUMBER" --repo "$REPO" --json labels \
               --jq '.labels[].name' | grep -qx "$type"; then
            echo "이미 붙어 있다: $type"
            exit 0
          fi

          # 🔴 라벨이 없으면 `gh pr edit` 이 실패한다. 라벨 생성은 `new-project.sh` 가
          # 저장소를 만들 때 한 번 한다 — 여기서 만들면 권한이 더 필요하고,
          # 이 워크플로는 벽이 아니므로 권한을 최소로 둔다.
          if ! gh pr edit "$NUMBER" --repo "$REPO" --add-label "$type"; then
            echo "::warning::라벨 '$type' 을 못 붙였다 — 저장소에 그 라벨이 있는지 확인해라"
            exit 0
          fi
          echo "붙였다: $type"
