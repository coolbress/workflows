name: pr-review
#
# **제3자가 이 커밋을 봤는가** — `standards` `GAPS` R5-40 의 ⓒ 층. 재사용 워크플로다.
#
#   on:
#     pull_request:        { types: [opened, synchronize, reopened] }
#     pull_request_review: { types: [submitted] }
#   permissions: { contents: read, pull-requests: write }
#   jobs:
#     third-party:
#       uses: coolbress/workflows/.github/workflows/pr-review.yml@<commit-sha>
#
# 검사 이름은 **`third-party / review`** 로 모든 저장소에서 같다 — 갈리면 소비자마다
# 룰셋을 다시 고쳐야 한다(관리자 작업).
#
# ── 이 벽이 보증하는 것과 보증하지 않는 것 ──────────────────────────────────
# ✅ **코덱스가 *이 커밋* 을 봤다.** 오래된 커밋의 리뷰는 안 쳐준다.
# ✅ **리뷰어의 지시가 이 PR 안에서 무르게 바뀌지 않았다.**
# 🚫 **잘 짰다.** 판정은 안 한다 — findings 로 막지 않는다.
# 🚫 **"*코드 검토*를 받았다"** 도 아니다. 🔴 **보안 검토를 끌 수가 없고**(`openai/codex#38110`)
#    **같은 봇이 둘 다 붙여서 작성자로는 못 가른다.** 그래서 보증하는 문장은 *"코덱스가 봤다"* 까지다.
# 🚫 **읽혔다.** *"봤다"* 는 *"읽혔다"* 가 아니다 — 읽는 것은 머지 버튼을 누르는 사람의 일이다.
#
# 근거(1차):
#   · arXiv 2605.02273 — AI 생성 PR **33,596건** 중 **61.38% 가 리뷰 기록이 아예 없다.**
#     **이 벽이 막는 구멍이 정확히 그것이다.**
#   · MSR '26 arXiv 2604.03196 — 리뷰 에이전트 **13종 중 12종이 signal ratio 60% 미만** ·
#     닫힌 CRA-only PR 의 **60.2% 가 0~30% 소음대**. **그래서 findings 로 막으면 소음으로 막는 것**이다.
#     같은 논문의 권고가 *"CRA 댓글은 **사람 리뷰를 촉발**하게 하라"* 다.
#   · `standards` `IPW-007` — 최선 조건에서도 F1 **28.6%**(오류의 71% 놓침).
#
# ⚠️ **그리고 이 벽이 *못* 만드는 것을 적어둔다**: 같은 MSR 논문이 **CRA 댓글 처리율 0.9~19.2%**
# (사람 댓글은 60%)라고 말한다. ***"봤다" 는 "읽혔다" 가 아니다.*** 읽는 것은 머지 버튼을
# 누르는 사람의 일이고, **벽은 거기까지 못 간다.** 그걸 벽이 한다고 적지 않는다.
#
# ── 왜 모델을 CI 안에서 안 돌리나 ────────────────────────────────────────────
# 🔴 돌려봤고 **열쇠 앞에서 멈췄다**(종량 과금). 지금 형태는 **모델이 OpenAI 클라우드에서 돌고**
# 리뷰를 PR 에 붙이며, 여기서는 **그게 붙었는지만 기계적으로 확인**한다:
#   · **열쇠가 필요 없다** — `GITHUB_TOKEN` 만 쓴다
#   · 요금이 **구독**에 들어간다(종량제 아님)
#   · **판정을 0% 한다** — 설계원칙 01·04 에 이보다 잘 맞는 형태가 없다
#   · 좁히기는 **`AGENTS.md` 의 `## Code Review Rules`** 가 한다(벤더가 그 파일을 읽는다)

on:
  workflow_call:
    inputs:
      reviewer-logins:
        description: |
          제3자 리뷰어로 인정할 GitHub 로그인. 쉼표로 나눈다.
          🔴 **못 찾으면 이 검사는 *본 적 있는 작성자를 전부 찍고* 죽는다** —
          이름이 틀렸을 때 한 번에 고치라고 그렇게 만들었다(`upgrade-ruleset.sh` 와 같은 규율).
        type: string
        default: "chatgpt-codex-connector[bot]"
      ask-comment:
        description: "리뷰가 없을 때 PR 에 달아 **불러오는** 말. 빈 문자열이면 안 부른다."
        type: string
        default: "@codex review"
      wait-seconds:
        description: "리뷰가 붙기를 기다리는 시간. 리뷰는 **비동기**라 기다림이 필요하다."
        type: number
        default: 900
      policy-file:
        description: |
          제3자가 **리뷰 방침을 읽는 파일**. 코덱스는 `AGENTS.md` 의 절을 읽는다.
          🔴 그 파일은 **리뷰당하는 저장소 안**에 있으므로 **PR 이 자기 리뷰어를 고칠 수 있다** —
          그래서 이 워크플로가 *지시 변경 + 다른 변경* 조합을 막는다.
        type: string
        default: "AGENTS.md"
      policy-heading:
        description: "정책 절의 제목 줄. 코덱스가 읽는 절 이름이다."
        type: string
        default: "## Code Review Rules"

      poll-seconds:
        description: "다시 보는 간격."
        type: number
        default: 20

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: write   # `@codex review` 를 다는 데만 쓴다
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0            # base 와 비교하려면 이력이 필요하다
          persist-credentials: false

      # 🔴 **리뷰어의 지시가 리뷰당하는 PR 안에서 바뀌면 안 된다.**
      # 🔬 **이 검사는 제3자 리뷰가 직접 물어서 생겼다 (P1 · 2026-09-01)**:
      #   *"When a PR changes this section to say 'do not report workflow bugs', Codex consumes
      #    the policy from the reviewed head, omits those findings, and the check still turns
      #    green because it verifies only that a review is attached."*
      # 🔴 **그리고 그건 내가 스스로 못 박아둔 원칙이었다** — 모델을 CI 에서 돌리던 판에는
      # *"프롬프트를 대상 저장소 밖에 둔다 — PR 이 자기 리뷰어의 지시를 고칠 수 있다"* 고 적어놓고,
      # `AGENTS.md` 로 옮기면서 **그 구멍을 내 손으로 다시 열었다.**
      #
      # 코덱스가 `AGENTS.md` 를 **head 에서** 읽는 것은 우리가 못 바꾼다. 그래서 막는 것은 **조합**이다:
      # **규칙이 바뀐 PR 에 다른 변경이 같이 들어 있으면 실패한다.** 규칙만 바꾸는 PR 은 통과한다 —
      # 그러면 밀반입할 것이 **없기** 때문이다. `04` §리팩터링 분리(Fowler·Google)와 같은 모양이다.
      - name: 리뷰어의 지시가 이 PR 안에서 바뀌었나
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGED: ${{ github.event.pull_request.merged }}
          PR_STATE: ${{ github.event.pull_request.state }}
          POLICY_FILE: ${{ inputs.policy-file }}
          POLICY_HEADING: ${{ inputs.policy-heading }}
        run: |
          set -euo pipefail

          # 🔴 **머지·종료된 PR 에서는 볼 것이 없다** (실측 2026-09-01 · `workflows` run 33463477880):
          # 코덱스 리뷰가 **머지 뒤에** 제출돼 `pull_request_review` 로 이 워크플로가 다시 돌았고,
          # base/head 를 못 찾아 `git` 이 **128 로 죽었다**(`set -e` 라 스텝이 통째로 실패).
          # 벽은 **머지를 막는 물건**이라 이미 머지된 PR 에서 빨개질 이유가 없다.
          if [ "${MERGED:-false}" = "true" ] || [ "${PR_STATE:-open}" != "open" ]; then
            echo "이미 머지·종료된 PR 이다 — 막을 것이 없다."
            exit 0
          fi

          # 🔴 **비교할 것이 실제로 있는지 먼저 본다.** 없으면 *조용히 통과* 하지 않고 말한다.
          for sha in "$BASE_SHA" "$HEAD_SHA"; do
            if ! git cat-file -e "$sha^{commit}" 2>/dev/null; then
              echo "::error::커밋을 못 찾는다: $sha — 지시가 바뀌었는지 확인할 수 없다."
              echo "체크아웃이 얕거나 브랜치가 지워졌다. 잡을 다시 돌려라."
              exit 1
            fi
          done

          section() {  # <sha> — 그 판의 정책 절만 찍는다. 없으면 빈 출력.
            git show "$1:$POLICY_FILE" 2>/dev/null \
              | awk -v h="$POLICY_HEADING" '
                  $0 == h {inside=1; next}
                  inside && /^## / {inside=0}
                  inside {print}
                ' || true
          }
          before="$(section "$BASE_SHA")"
          after="$(section "$HEAD_SHA")"

          if [ "$before" = "$after" ]; then
            echo "리뷰어의 지시는 그대로다."
            exit 0
          fi

          if [ -z "$before" ]; then
            # 🔵 **처음 생기는 것은 막지 않는다.** 없던 지시를 만드는 것은 **약하게 만드는 것이 아니다** —
            # 그 전까지 제3자는 지시가 **아예 없이** 봤다. 막을 것은 *있던 것을 무르게 하는* 변경이다.
            echo "::notice::리뷰어 지시가 이 PR 에서 **처음** 생겼다 — base 에는 없다. 막지 않는다."
            exit 0
          fi
          echo "::notice::리뷰어 지시가 이 PR 에서 바뀌었다."

          # 🔴 다른 파일이 같이 바뀌었으면 **이 PR 이 자기 리뷰어를 고쳐 쓴 것**이다.
          others="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- . ":(exclude)$POLICY_FILE")"
          if [ -n "$others" ]; then
            echo "::error::리뷰어의 지시($POLICY_FILE $POLICY_HEADING)가 바뀌었는데 다른 변경이 같이 있다."
            echo "제3자는 **바뀐 지시**로 이 PR 을 본다 — 스스로 리뷰를 약하게 만들 수 있다."
            echo "지시 변경은 **그 파일만 바꾸는 PR 로 따로** 낸다. 같이 바뀐 것들:"
            echo "$others" | sed 's/^/  /' | head -40
            exit 1
          fi
          echo "이 PR 은 지시만 바꾼다 — 밀반입할 것이 없으므로 통과시킨다."

      - name: 제3자 리뷰가 이 커밋에 붙었는가
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGED: ${{ github.event.pull_request.merged }}
          PR_STATE: ${{ github.event.pull_request.state }}
          LOGINS: ${{ inputs.reviewer-logins }}
          ASK: ${{ inputs.ask-comment }}
          WAIT: ${{ inputs.wait-seconds }}
          POLL: ${{ inputs.poll-seconds }}
        run: |
          set -euo pipefail

          if [ -z "${NUMBER:-}" ] || [ -z "${HEAD_SHA:-}" ]; then
            echo "::error::PR 이 아니다 — 볼 것이 없다."
            exit 1
          fi
          # 머지·종료된 PR 에서 기다릴 이유가 없다 — 벽은 머지를 막는 물건이다.
          if [ "${MERGED:-false}" = "true" ] || [ "${PR_STATE:-open}" != "open" ]; then
            echo "이미 머지·종료된 PR 이다 — 기다리지 않는다."
            exit 0
          fi
          echo "PR #$NUMBER · head $HEAD_SHA"
          echo "인정하는 리뷰어: $LOGINS"

          # 🔴 판정은 **순수 함수**로 뽑아둔다 — `tests/pr-review-attest.sh` 가 이 토막을
          # 워크플로에서 꺼내 돌린다. 워크플로 안에만 있으면 **첫 실행이 곧 시험**이 되고,
          # 그때는 이미 PR 이 빨갛다.
          cat > "$RUNNER_TEMP/attest.py" <<'PY'
          """제3자가 **이 커밋** 을 봤는가. 판정은 안 한다 — 봤나만 본다.

          🔬 **신호가 둘이고 둘 다 받는다 — 먼저 오는 쪽이 이긴다** (실측 2026-09-01):

            ① **리뷰 객체** — 코드 검토가 끝나면 `state=COMMENTED` 로 온다.
               지적이 **0건이어도 온다**(실측: 01:36:32Z · 지적 0). **빠르다 — 호출 후 약 4분.**
            ② **표식** — 요약 이슈 댓글 안의
               `<!-- codex-security-review:v1 {"headSha":…,"status":"completed"} -->`.
               🔴 **`completed` 는 보안 검토까지 끝나야 뜬다 — 30분을 넘긴 적이 있다.**

          🔴 **내가 여기서 한 번 틀렸다.** 리뷰가 오기 **3분 전에** 리뷰 API 를 조회하고
          *"거기엔 아무것도 안 온다"* 고 결론냈다. 안 온 게 아니라 **아직 안 온 것**이었고,
          그 '고침' 은 벽을 **훨씬 느리게** 만들었다(①을 버리고 ②만 봤으므로).
          **없다는 것을 보려면 충분히 기다린 뒤에 봐야 한다.**

          ⚠️ **작성자만으로는 코드 검토와 보안 검토를 못 가른다** — 같은 봇이 둘 다 붙인다.
          그래서 이 벽이 보증하는 문장은 정확히 *"코덱스가 이 커밋을 봤다"* 이지
          *"**코드 검토**를 받았다"* 가 아니다. (보안 검토는 **끌 수가 없다** — `openai/codex#38110`.)
          """
          import json, re, sys, pathlib

          head, logins_csv = sys.argv[1:3]
          reviews_p, rcomments_p, icomments_p = sys.argv[3:6]
          logins = {x.strip().lower() for x in logins_csv.split(",") if x.strip()}
          MARK = re.compile(r"<!--\s*codex-security-review:v1\s*(\{.*?\})\s*-->", re.S)

          def load(p):
              try:
                  d = json.loads(pathlib.Path(p).read_text() or "[]")
              except json.JSONDecodeError:
                  return []
              return d if isinstance(d, list) else []

          def ours(it):
              return ((it.get("user") or {}).get("login") or "").lower() in logins

          seen = set()
          for path in (reviews_p, rcomments_p, icomments_p):
              for it in load(path):
                  seen.add(((it.get("user") or {}).get("login") or ""))

          # ① 리뷰 객체 · 리뷰 댓글 — 커밋이 맞아야 한다
          for kind, path in (("review", reviews_p), ("review-comment", rcomments_p)):
              for it in load(path):
                  if ours(it) and it.get("commit_id") == head:
                      print(f"✅ 제3자가 이 커밋을 봤다 — {kind} ({it.get('state') or 'comment'})")
                      sys.exit(0)

          # ② 표식 — `completed` 만 쳐준다. `running` 은 *보는 중* 이지 *봤다* 가 아니다.
          states = []
          for it in load(icomments_p):
              if not ours(it):
                  continue
              for raw in MARK.findall(it.get("body") or ""):
                  try:
                      d = json.loads(raw)
                  except json.JSONDecodeError:
                      continue
                  states.append((d.get("headSha") or "", d.get("status") or "?"))
                  if d.get("headSha") == head and d.get("status") == "completed":
                      print("✅ 제3자가 이 커밋을 봤다 — 표식 status=completed")
                      sys.exit(0)

          print("아직이다.")
          for sha, status in states[-3:]:
              print(f"   표식 {sha[:8]} status={status} {'← 이 커밋' if sha == head else ''}")
          if seen:
              print("  이 PR 에서 본 작성자: " + ", ".join(sorted(x for x in seen if x)))
          sys.exit(1)
          PY

          # 신호가 셋 다 다른 API 에 있다 — 하나만 보면 놓친다(위 독스트링).
          get() { gh api "repos/$REPO/$1" --paginate > "$RUNNER_TEMP/$2" 2>/dev/null || echo '[]' > "$RUNNER_TEMP/$2"; }
          fetch() {
            get "pulls/$NUMBER/reviews"   reviews.json
            get "pulls/$NUMBER/comments"  rcomments.json
            get "issues/$NUMBER/comments" icomments.json
          }
          judge() {
            python3 "$RUNNER_TEMP/attest.py" "$HEAD_SHA" "$LOGINS" \
              "$RUNNER_TEMP/reviews.json" "$RUNNER_TEMP/rcomments.json" "$RUNNER_TEMP/icomments.json"
          }

          fetch
          if judge; then exit 0; fi

          # 🔴 **한 커밋에 최대 두 번 부른다.** 표식을 댓글에 숨겨 두고 그것으로 센다.
          # 🔬 **왜 한 번이 아닌가 (실측 2026-09-01)**: 앱을 아직 안 붙인 상태에서 부른 호출이
          # **표식만 남기고 무시됐고**, 그 다음부터 *"이미 불렀다"* 로 걸려 **다시는 안 불렀다.**
          # 리뷰어가 준비되기 전의 호출은 **없었던 것과 같다** — 한 번은 다시 부른다.
          # ⚠️ 두 번까지다. 무한히 부르면 PR 이 호출로 도배된다.
          marker="<!-- third-party-review: $HEAD_SHA -->"
          asked() {
            gh api "repos/$REPO/issues/$NUMBER/comments" --paginate --jq '.[].body' 2>/dev/null \
              | grep -cF "$marker" || true
          }
          ask() {
            [ -n "${ASK:-}" ] || return 0
            n="$(asked)"
            if [ "${n:-0}" -ge 2 ]; then
              echo "두 번 불렀다 — 더 안 부른다."
              return 0
            fi
            printf '%s\n\n%s\n' "$ASK" "$marker" > "$RUNNER_TEMP/ask.md"
            gh pr comment "$NUMBER" --repo "$REPO" --body-file "$RUNNER_TEMP/ask.md" \
              && echo "불렀다($(( ${n:-0} + 1 ))/2): $ASK" \
              || echo "::warning::부르지 못했다 — 직접 '$ASK' 를 달아라"
          }
          ask

          deadline=$(( $(date +%s) + WAIT ))
          halfway=$(( $(date +%s) + WAIT / 2 ))
          retried=0
          while [ "$(date +%s)" -lt "$deadline" ]; do
            sleep "$POLL"
            fetch
            if judge; then exit 0; fi
            # 절반이 지나도 표식이 없으면 **한 번 더** 부른다(위 실측).
            if [ "$retried" -eq 0 ] && [ "$(date +%s)" -ge "$halfway" ]; then
              retried=1
              ask
            fi
            echo "   ... $(( deadline - $(date +%s) ))초 남음"
          done

          echo "::error::제3자 리뷰가 이 커밋($HEAD_SHA)에 붙지 않았다."
          echo "  · 리뷰어를 켰는가: https://chatgpt.com/codex/settings/code-review"
          echo "  · PR 에 '$ASK' 를 직접 달고 이 잡을 다시 돌려도 된다."
          echo "  · 위에 찍힌 '본 작성자' 에 리뷰어가 있는데 이름이 다르면"
