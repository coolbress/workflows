name: pr-review
#
# **제3자가 이 커밋을 봤는가** — `standards` `GAPS` R5-40 의 ⓒ 층. 재사용 워크플로다.
#
#   on:
#     pull_request:        { types: [opened, synchronize, reopened] }
#     pull_request_review: { types: [submitted] }
#   permissions: { contents: read, pull-requests: write }
#   jobs:
#     third-party:
#       uses: coolbress/workflows/.github/workflows/pr-review.yml@<commit-sha>
#
# 검사 이름은 **`third-party / review`** 로 모든 저장소에서 같다 — 갈리면 소비자마다
# 룰셋을 다시 고쳐야 한다(관리자 작업).
#
# ── 이 벽이 보증하는 것과 보증하지 않는 것 ──────────────────────────────────
# ✅ **제3자가 *이 커밋* 을 봤다.** 오래된 커밋의 리뷰는 안 쳐준다.
# 🚫 **잘 짰다.** 판정은 안 한다 — findings 로 막지 않는다.
#
# 근거(1차):
#   · arXiv 2605.02273 — AI 생성 PR **33,596건** 중 **61.38% 가 리뷰 기록이 아예 없다.**
#     **이 벽이 막는 구멍이 정확히 그것이다.**
#   · MSR '26 arXiv 2604.03196 — 리뷰 에이전트 **13종 중 12종이 signal ratio 60% 미만** ·
#     닫힌 CRA-only PR 의 **60.2% 가 0~30% 소음대**. **그래서 findings 로 막으면 소음으로 막는 것**이다.
#     같은 논문의 권고가 *"CRA 댓글은 **사람 리뷰를 촉발**하게 하라"* 다.
#   · `standards` `IPW-007` — 최선 조건에서도 F1 **28.6%**(오류의 71% 놓침).
#
# ⚠️ **그리고 이 벽이 *못* 만드는 것을 적어둔다**: 같은 MSR 논문이 **CRA 댓글 처리율 0.9~19.2%**
# (사람 댓글은 60%)라고 말한다. ***"봤다" 는 "읽혔다" 가 아니다.*** 읽는 것은 머지 버튼을
# 누르는 사람의 일이고, **벽은 거기까지 못 간다.** 그걸 벽이 한다고 적지 않는다.
#
# ── 왜 모델을 CI 안에서 안 돌리나 ────────────────────────────────────────────
# 🔴 돌려봤고 **열쇠 앞에서 멈췄다**(종량 과금). 지금 형태는 **모델이 OpenAI 클라우드에서 돌고**
# 리뷰를 PR 에 붙이며, 여기서는 **그게 붙었는지만 기계적으로 확인**한다:
#   · **열쇠가 필요 없다** — `GITHUB_TOKEN` 만 쓴다
#   · 요금이 **구독**에 들어간다(종량제 아님)
#   · **판정을 0% 한다** — 설계원칙 01·04 에 이보다 잘 맞는 형태가 없다
#   · 좁히기는 **`AGENTS.md` 의 `## Code Review Rules`** 가 한다(벤더가 그 파일을 읽는다)

on:
  workflow_call:
    inputs:
      reviewer-logins:
        description: |
          제3자 리뷰어로 인정할 GitHub 로그인. 쉼표로 나눈다.
          🔴 **못 찾으면 이 검사는 *본 적 있는 작성자를 전부 찍고* 죽는다** —
          이름이 틀렸을 때 한 번에 고치라고 그렇게 만들었다(`upgrade-ruleset.sh` 와 같은 규율).
        type: string
        default: "chatgpt-codex-connector[bot]"
      ask-comment:
        description: "리뷰가 없을 때 PR 에 달아 **불러오는** 말. 빈 문자열이면 안 부른다."
        type: string
        default: "@codex review"
      wait-seconds:
        description: "리뷰가 붙기를 기다리는 시간. 리뷰는 **비동기**라 기다림이 필요하다."
        type: number
        default: 900
      poll-seconds:
        description: "다시 보는 간격."
        type: number
        default: 20

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: write   # `@codex review` 를 다는 데만 쓴다
    steps:
      - name: 제3자 리뷰가 이 커밋에 붙었는가
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LOGINS: ${{ inputs.reviewer-logins }}
          ASK: ${{ inputs.ask-comment }}
          WAIT: ${{ inputs.wait-seconds }}
          POLL: ${{ inputs.poll-seconds }}
        run: |
          set -euo pipefail

          if [ -z "${NUMBER:-}" ] || [ -z "${HEAD_SHA:-}" ]; then
            echo "::error::PR 이 아니다 — 볼 것이 없다."
            exit 1
          fi
          echo "PR #$NUMBER · head $HEAD_SHA"
          echo "인정하는 리뷰어: $LOGINS"

          # 🔴 판정은 **순수 함수**로 뽑아둔다 — `tests/pr-review-attest.sh` 가 이 토막을
          # 워크플로에서 꺼내 돌린다. 워크플로 안에만 있으면 **첫 실행이 곧 시험**이 되고,
          # 그때는 이미 PR 이 빨갛다.
          cat > "$RUNNER_TEMP/attest.py" <<'PY'
          """제3자 리뷰가 **이 커밋에서 끝났는가.** 판정은 안 한다 — 돌았나만 본다.

          🔬 **실측(2026-09-01)으로 모양을 잡았다.** 첫 판은 `pulls/*/reviews` 와
          `pulls/*/comments` 를 뒤졌는데 **거기엔 아무것도 안 온다.** 코덱스는
          **이슈 댓글** 하나에 요약을 붙이고, 그 안에 기계용 표식을 넣는다:

              <!-- codex-security-review:v1 {"headSha":"…","status":"completed", …} -->

          🔴 **그리고 리뷰 객체에 기대면 안 되는 결정적 이유**: 벤더 문서가
          *"comments if it has suggestions, and **reacts with 👍 once all reviews
          finish with no findings**"* 라고 한다 — **깨끗한 PR 은 리뷰도 댓글도 안 남는다.**
          첫 판이었다면 **잘 짠 PR 일수록 영원히 빨갰다.**

          ⚠️ 표식 이름이 `codex-security-review` 지만 **코드 검토와 보안 검토 둘 다**를 덮는다
          (실측: 같은 표식 아래 두 줄이 각각 Completed 로 바뀐다). 벤더가 그렇게 지었다.
          """
          import json, re, sys, pathlib

          head, logins_csv, comments_p = sys.argv[1:4]
          logins = {x.strip().lower() for x in logins_csv.split(",") if x.strip()}
          MARK = re.compile(r"<!--\s*codex-security-review:v1\s*(\{.*?\})\s*-->", re.S)

          try:
              items = json.loads(pathlib.Path(comments_p).read_text() or "[]")
          except json.JSONDecodeError:
              items = []
          if not isinstance(items, list):
              items = []

          seen, states = set(), []
          for it in items:
              who = ((it.get("user") or {}).get("login") or "")
              seen.add(who)
              if who.lower() not in logins:
                  continue
              for raw in MARK.findall(it.get("body") or ""):
                  try:
                      d = json.loads(raw)
                  except json.JSONDecodeError:
                      continue
                  states.append((d.get("headSha") or "", d.get("status") or "?", d))

          for sha, status, d in states:
              if sha != head:
                  continue
              # 🔴 **끝난 것만 쳐준다.** `running` 을 통과시키면 *"보는 중"* 이 *"봤다"* 가 된다.
              if status == "completed":
                  gate = d.get("mergeGateEnabled")
                  print(f"✅ 제3자가 이 커밋을 봤다 — status=completed (mergeGate={gate})")
                  sys.exit(0)

          if states:
              print("아직이다 — 이 PR 의 표식:")
              for sha, status, _ in states[-3:]:
                  mark = "← 이 커밋" if sha == head else ""
                  print(f"   {sha[:8]} status={status} {mark}")
          else:
              print("표식이 없다 — 리뷰가 아직 안 걸렸다.")
          if seen:
              print("  이 PR 에서 본 댓글 작성자: " + ", ".join(sorted(x for x in seen if x)))
          sys.exit(1)
          PY

          # 🔴 **이슈 댓글**이다. 리뷰 API 가 아니다 — 위 독스트링의 실측을 읽어라.
          fetch() {
            gh api "repos/$REPO/issues/$NUMBER/comments" --paginate \
              > "$RUNNER_TEMP/comments.json" 2>/dev/null || echo '[]' > "$RUNNER_TEMP/comments.json"
          }
          judge() {
            python3 "$RUNNER_TEMP/attest.py" "$HEAD_SHA" "$LOGINS" "$RUNNER_TEMP/comments.json"
          }

          fetch
          if judge; then exit 0; fi

          # 🔴 **한 커밋에 최대 두 번 부른다.** 표식을 댓글에 숨겨 두고 그것으로 센다.
          # 🔬 **왜 한 번이 아닌가 (실측 2026-09-01)**: 앱을 아직 안 붙인 상태에서 부른 호출이
          # **표식만 남기고 무시됐고**, 그 다음부터 *"이미 불렀다"* 로 걸려 **다시는 안 불렀다.**
          # 리뷰어가 준비되기 전의 호출은 **없었던 것과 같다** — 한 번은 다시 부른다.
          # ⚠️ 두 번까지다. 무한히 부르면 PR 이 호출로 도배된다.
          marker="<!-- third-party-review: $HEAD_SHA -->"
          asked() {
            gh api "repos/$REPO/issues/$NUMBER/comments" --paginate --jq '.[].body' 2>/dev/null \
              | grep -cF "$marker" || true
          }
          ask() {
            [ -n "${ASK:-}" ] || return 0
            n="$(asked)"
            if [ "${n:-0}" -ge 2 ]; then
              echo "두 번 불렀다 — 더 안 부른다."
              return 0
            fi
            printf '%s\n\n%s\n' "$ASK" "$marker" > "$RUNNER_TEMP/ask.md"
            gh pr comment "$NUMBER" --repo "$REPO" --body-file "$RUNNER_TEMP/ask.md" \
              && echo "불렀다($(( ${n:-0} + 1 ))/2): $ASK" \
              || echo "::warning::부르지 못했다 — 직접 '$ASK' 를 달아라"
          }
          ask

          deadline=$(( $(date +%s) + WAIT ))
          halfway=$(( $(date +%s) + WAIT / 2 ))
          retried=0
          while [ "$(date +%s)" -lt "$deadline" ]; do
            sleep "$POLL"
            fetch
            if judge; then exit 0; fi
            # 절반이 지나도 표식이 없으면 **한 번 더** 부른다(위 실측).
            if [ "$retried" -eq 0 ] && [ "$(date +%s)" -ge "$halfway" ]; then
              retried=1
              ask
            fi
            echo "   ... $(( deadline - $(date +%s) ))초 남음"
          done

          echo "::error::제3자 리뷰가 이 커밋($HEAD_SHA)에 붙지 않았다."
          echo "  · 리뷰어를 켰는가: https://chatgpt.com/codex/settings/code-review"
          echo "  · PR 에 '$ASK' 를 직접 달고 이 잡을 다시 돌려도 된다."
          echo "  · 위에 찍힌 '본 작성자' 에 리뷰어가 있는데 이름이 다르면"
          echo "    호출부의 reviewer-logins 를 그 이름으로 고쳐라."
          exit 1
